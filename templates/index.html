<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>J.A.R.V.I.S. // STEALTH OPS HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-green: #39ff14;
      --neon-violet: #bd00ff;
      --dark-bg: #050807;
      --panel-bg: rgba(7, 18, 12, 0.85);
      --border-color: rgba(57, 255, 20, 0.4);
      --font-mono: 'Share Tech Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--dark-bg);
      background-image:
        radial-gradient(ellipse at center, rgba(189, 0, 255, 0.08) 0%, rgba(5, 8, 7, 0.95) 75%),
        linear-gradient(rgba(57, 255, 20, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57, 255, 20, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--neon-green);
      font-family: var(--font-mono);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 12px;
    }
    .glow-green { text-shadow: 0 0 10px var(--neon-green); }
    .glow-violet { text-shadow: 0 0 10px var(--neon-violet); color: var(--neon-violet); }
    header {
      display: flex; justify-content: space-between; align-items: center;
      border: 1px solid var(--border-color); border-bottom: 2px solid var(--neon-green);
      background: var(--panel-bg); padding: 10px 16px; margin-bottom: 12px;
    }
    .brand { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 2px; }
    .hud-grid { display: grid; grid-template-columns: 260px 1fr 260px; gap: 12px; height: calc(100vh - 85px); }
    .panel { background: var(--panel-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 12px; }
    .panel-header { font-family: var(--font-display); font-size: 0.85rem; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .stat-row { margin-bottom: 12px; font-size: 0.8rem; }
    .bar-container { height: 6px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(57, 255, 20, 0.3); margin-top: 4px; }
    .bar-fill { height: 100%; background: var(--neon-green); transition: width 0.4s ease; }
    .bar-fill.violet { background: var(--neon-violet); }
    .center-panel { display: flex; flex-direction: column; gap: 10px; }
    .radar-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; min-height: 160px; }
    canvas#radar { position: absolute; width: 100%; height: 100%; }
    .terminal-box { height: 260px; background: rgba(0, 0, 0, 0.9); border: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 8px; }
    .terminal-logs { flex: 1; overflow-y: auto; font-size: 0.8rem; line-height: 1.4; word-break: break-word; }
    .terminal-input-bar { display: flex; gap: 6px; border-top: 1px solid rgba(57, 255, 20, 0.2); padding-top: 6px; margin-top: 4px; }
    input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: var(--font-mono); font-size: 0.85rem; }
    .btn { background: rgba(57, 255, 20, 0.08); border: 1px solid var(--neon-green); color: var(--neon-green); padding: 8px; font-family: var(--font-display); font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }
    .btn:hover { background: var(--neon-green); color: #000; }
    .btn-violet { border-color: var(--neon-violet); color: var(--neon-violet); }
    .btn-violet:hover { background: var(--neon-violet); color: #fff; }
    @media (max-width: 850px) { .hud-grid { grid-template-columns: 1fr; height: auto; } }
  </style>
</head>
<body>
  <header>
    <div class="brand glow-green">⚙ J.A.R.V.I.S. // MOBILE AI</div>
    <div id="clock" style="letter-spacing: 1px; font-size: 0.85rem;">00:00:00</div>
  </header>

  <main class="hud-grid">
    <section class="panel">
      <div class="panel-header"><span>TELEMETRY</span><span class="glow-violet">CORE</span></div>
      <div class="stat-row">
        <div>CLOUD STATUS: <span id="cloud-stat" class="glow-violet">CHECKING...</span></div>
        <div class="bar-container"><div id="bar-cloud" class="bar-fill violet" style="width: 50%;"></div></div>
      </div>
      <div class="stat-row">
        <div>NEURAL BUFFER: <span id="stat-buf">42.0%</span></div>
        <div class="bar-container"><div id="bar-buf" class="bar-fill" style="width: 42%;"></div></div>
      </div>
      <div style="margin-top: auto; font-size: 0.7rem; line-height: 1.5; border-top: 1px dashed var(--border-color); padding-top: 8px;">
        <div>KEY SETUP: type <span style="color:#fff;">set key &lt;YOUR_API_KEY&gt;</span></div>
      </div>
    </section>

    <section class="panel center-panel">
      <div class="radar-wrapper"><canvas id="radar"></canvas></div>
      <div class="terminal-box">
        <div class="terminal-logs" id="logs">
          <div>[SYSTEM] J.A.R.V.I.S. Online. Connected to Python core.</div>
        </div>
        <div class="terminal-input-bar">
          <span style="color:var(--neon-violet)">&gt;</span>
          <input type="text" id="cmdInput" placeholder="Enter directive or ask Gemini..." autofocus />
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header"><span>COMMANDS</span><span class="glow-green">DIRECT</span></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button class="btn" onclick="sendPrompt('search latest technology news')">INTEL SEARCH</button>
        <button class="btn btn-violet" onclick="testVoice()">VOICE SYNTH</button>
        <button class="btn" onclick="sendPrompt('status')">SYSTEM AUDIT</button>
        <button class="btn btn-violet" onclick="document.getElementById('logs').innerHTML=''">CLEAR LOGS</button>
      </div>
    </section>
  </main>

  <script>
    function updateClock() {
      document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Radar Canvas
    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    let angle = 0;
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const radius = Math.min(cx, cy) - 15;
      ctx.strokeStyle = 'rgba(57, 255, 20, 0.25)';
      ctx.lineWidth = 1;
      for (let r = 30; r <= radius; r += 30) {
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      const grad = ctx.createLinearGradient(0, 0, radius, 0);
      grad.addColorStop(0, 'rgba(57, 255, 20, 0.8)');
      grad.addColorStop(1, 'transparent');
      ctx.strokeStyle = grad; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(radius, 0); ctx.stroke();
      ctx.restore();
      angle += 0.03;
      requestAnimationFrame(drawRadar);
    }
    drawRadar();

    // Voice Synthesis
    function speak(phrase) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(phrase);
        u.pitch = 0.95; u.rate = 1.0;
        window.speechSynthesis.speak(u);
      }
    }

    function addLog(text, color = 'var(--neon-green)') {
      const line = document.createElement('div');
      line.style.color = color;
      line.innerHTML = text;
      logs.appendChild(line);
      logs.scrollTop = logs.scrollHeight;
    }

    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('cloud-stat').innerText = data.cloud_ready ? 'ONLINE (GEMINI)' : 'NO API KEY';
        document.getElementById('bar-cloud').style.width = data.cloud_ready ? '100%' : '20%';
      } catch (e) {}
    }
    setInterval(checkStatus, 5000);
    checkStatus();

    async function sendPrompt(cmd) {
      if (!cmd.trim()) return;
      addLog(`&gt; YOU: ${cmd}`, 'var(--neon-violet)');
      addLog(`[JARVIS] Processing query...`, '#888');

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({command: cmd})
        });
        const data = await res.json();
        addLog(`[${data.source}] ${data.response}`, 'var(--neon-green)');
        speak(data.response);
      } catch (err) {
        addLog(`[ERROR] Unable to reach Jarvis core: ${err}`, '#ff3366');
      }
    }

    const cmdInput = document.getElementById('cmdInput');
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = cmdInput.value;
        cmdInput.value = '';
        sendPrompt(val);
      }
    });

    function testVoice() {
      speak("Voice synthesizer active. All mobile subsystems fully operational.");
    }
  </script>
</body>
</html>
